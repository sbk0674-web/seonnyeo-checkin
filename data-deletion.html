<p>Seonnyeo Tools 앱이 보관하는 이용자 정보(인스타그램 계정 ID, 댓글 ID)의 삭제를 원하시면 아래 방법으로 요청해 주세요.</p>
<ol><li>이메일 <b>cannonfort@naver.com</b>으로 "데이터 삭제 요청"이라는 제목과 함께 본인의 인스타그램 사용자 이름을 보내주세요.</li><li>요청을 확인한 날부터 7일 이내에 해당 정보를 삭제하고 회신드립니다.</li></ol>
